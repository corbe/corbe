<svg xmlns="http://www.w3.org/2000/svg" width="850" height="261" viewBox="0 0 850 261">
  <defs/>

  <!-- Card background -->
  <rect x="0.5" y="0.5" width="849" height="260" rx="12" ry="12"
        fill="#0f1623" stroke="#1a2332" stroke-width="1"/>

  <!-- Left: Language Telemetry -->
  <text x="30" y="38" fill="#64748b" font-size="11" font-family="monospace" letter-spacing="3">STACK TELEMETRY</text>

  <!-- Vertical divider -->
  <line x1="425" y1="25" x2="425" y2="236" stroke="#1a2332" stroke-width="1" opacity="0.4"/>

  <!-- Right: Focus Sectors -->
  <text x="460" y="38" fill="#64748b" font-size="11" font-family="monospace" letter-spacing="3">FOCUS SECTORS</text>

  <!-- Language bars -->
  <g transform="translate(30, 65)">
    <text x="0" y="0" fill="#94a3b8" font-size="11" font-family="sans-serif" dominant-baseline="middle">TypeScript</text>
    <rect x="130" y="-6" width="132.0" height="12" rx="3" fill="#3178c6" opacity="0.85">
      <animate attributeName="width" from="0" to="132.0" dur="0.8s" begin="0.0s" fill="freeze"/>
    </rect>
    <text x="350" y="0" fill="#64748b" font-size="10" font-family="monospace" dominant-baseline="middle">44.0%</text>
  </g>
  <g transform="translate(30, 87)">
    <text x="0" y="0" fill="#94a3b8" font-size="11" font-family="sans-serif" dominant-baseline="middle">Python</text>
    <rect x="130" y="-6" width="75.0" height="12" rx="3" fill="#3572A5" opacity="0.85">
      <animate attributeName="width" from="0" to="75.0" dur="0.8s" begin="0.1s" fill="freeze"/>
    </rect>
    <text x="350" y="0" fill="#64748b" font-size="10" font-family="monospace" dominant-baseline="middle">25.0%</text>
  </g>
  <g transform="translate(30, 109)">
    <text x="0" y="0" fill="#94a3b8" font-size="11" font-family="sans-serif" dominant-baseline="middle">JavaScript</text>
    <rect x="130" y="-6" width="45.0" height="12" rx="3" fill="#f1e05a" opacity="0.85">
      <animate attributeName="width" from="0" to="45.0" dur="0.8s" begin="0.2s" fill="freeze"/>
    </rect>
    <text x="350" y="0" fill="#64748b" font-size="10" font-family="monospace" dominant-baseline="middle">15.0%</text>
  </g>
  <g transform="translate(30, 131)">
    <text x="0" y="0" fill="#94a3b8" font-size="11" font-family="sans-serif" dominant-baseline="middle">PHP</text>
    <rect x="130" y="-6" width="33.0" height="12" rx="3" fill="#777BB3" opacity="0.85">
      <animate attributeName="width" from="0" to="33.0" dur="0.8s" begin="0.3s" fill="freeze"/>
    </rect>
    <text x="350" y="0" fill="#64748b" font-size="10" font-family="monospace" dominant-baseline="middle">11.0%</text>
  </g>
  <g transform="translate(30, 153)">
    <text x="0" y="0" fill="#94a3b8" font-size="11" font-family="sans-serif" dominant-baseline="middle">Go</text>
    <rect x="130" y="-6" width="9.0" height="12" rx="3" fill="#00ADD8" opacity="0.85">
      <animate attributeName="width" from="0" to="9.0" dur="0.8s" begin="0.4s" fill="freeze"/>
    </rect>
    <text x="350" y="0" fill="#64748b" font-size="10" font-family="monospace" dominant-baseline="middle">3.0%</text>
  </g>
  <g transform="translate(30, 175)">
    <text x="0" y="0" fill="#94a3b8" font-size="11" font-family="sans-serif" dominant-baseline="middle">CSS / HTML</text>
    <rect x="130" y="-6" width="6.0" height="12" rx="3" fill="#e34c26" opacity="0.85">
      <animate attributeName="width" from="0" to="6.0" dur="0.8s" begin="0.5s" fill="freeze"/>
    </rect>
    <text x="350" y="0" fill="#64748b" font-size="10" font-family="monospace" dominant-baseline="middle">2.0%</text>
  </g>

  <!-- Focus Sectors - Radar -->
  <circle cx="637" cy="140" r="22" fill="none" stroke="#64748b" stroke-width="0.5" stroke-dasharray="3,3" opacity="0.25"/>
  <circle cx="637" cy="140" r="44" fill="none" stroke="#64748b" stroke-width="0.5" stroke-dasharray="3,3" opacity="0.25"/>
  <circle cx="637" cy="140" r="65" fill="none" stroke="#64748b" stroke-width="0.5" stroke-dasharray="3,3" opacity="0.25"/>

  <!-- Sector 1: Backend Engineering -->
  <path d="M 637 140 L 662.4 83.0 A 65 65 0 0 1 698.0 108.5 Z" fill="#00d4ff" fill-opacity="0.10" stroke="#00d4ff" stroke-opacity="0.3" stroke-width="0.5"/>

  <!-- Sector 2: Monitoring & Observability -->
  <path d="M 637 140 L 700.5 192.0 A 65 65 0 0 1 580.0 193.0 Z" fill="#a78bfa" fill-opacity="0.10" stroke="#a78bfa" stroke-opacity="0.3" stroke-width="0.5"/>

  <!-- Sector 3: AI Systems -->
  <path d="M 637 140 L 575.0 190.0 A 65 65 0 0 1 573.0 120.0 Z" fill="#ffb020" fill-opacity="0.10" stroke="#ffb020" stroke-opacity="0.3" stroke-width="0.5"/>

  <!-- Sector 4: Full-Stack -->
  <path d="M 637 140 L 573.0 118.0 A 65 65 0 0 1 660.0 82.0 Z" fill="#10b981" fill-opacity="0.10" stroke="#10b981" stroke-opacity="0.3" stroke-width="0.5"/>

  <!-- Radial lines -->
  <line x1="637" y1="140" x2="637.0" y2="75.0" stroke="#64748b" stroke-width="0.5" opacity="0.3"/>
  <line x1="637" y1="140" x2="700.5" y2="192.0" stroke="#64748b" stroke-width="0.5" opacity="0.3"/>
  <line x1="637" y1="140" x2="575.0" y2="190.0" stroke="#64748b" stroke-width="0.5" opacity="0.3"/>
  <line x1="637" y1="140" x2="573.0" y2="118.0" stroke="#64748b" stroke-width="0.5" opacity="0.3"/>

  <!-- Labels -->
  <text x="637" y="68" text-anchor="middle" fill="#00d4ff" font-size="8" font-family="monospace" opacity="0.8">BACKEND</text>
  <text x="718" y="200" text-anchor="middle" fill="#a78bfa" font-size="8" font-family="monospace" opacity="0.8">MONITORING</text>
  <text x="560" y="205" text-anchor="middle" fill="#ffb020" font-size="8" font-family="monospace" opacity="0.8">AI</text>
  <text x="555" y="110" text-anchor="middle" fill="#10b981" font-size="8" font-family="monospace" opacity="0.8">FULLSTACK</text>
</svg>
