<svg xmlns="http://www.w3.org/2000/svg" width="850" height="240" viewBox="0 0 850 240">
  <defs>
    <filter id="proj-glow-0" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4" in="SourceGraphic" result="blur"/>
      <feFlood flood-color="#a78bfa" flood-opacity="0.6" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="proj-glow-1" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4" in="SourceGraphic" result="blur"/>
      <feFlood flood-color="#ffb020" flood-opacity="0.6" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="proj-glow-2" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4" in="SourceGraphic" result="blur"/>
      <feFlood flood-color="#00d4ff" flood-opacity="0.6" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="card-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2332" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0f1623" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="conn-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0.4"/>
    </linearGradient>
    <clipPath id="card-clip-0"><rect x="32.5" y="55" width="240" height="155" rx="8" ry="8"/></clipPath>
    <clipPath id="card-clip-1"><rect x="305.0" y="55" width="240" height="155" rx="8" ry="8"/></clipPath>
    <clipPath id="card-clip-2"><rect x="577.5" y="55" width="240" height="155" rx="8" ry="8"/></clipPath>
    <style>
      @keyframes twinkle { 0%, 100% { opacity: 0.1; } 50% { opacity: 0.6; } }
      @keyframes orbit { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      @keyframes card-appear {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect x="0.5" y="0.5" width="849" height="239" rx="12" ry="12" fill="#0f1623" stroke="#1a2332" stroke-width="1"/>

  <!-- Title -->
  <text x="30" y="38" fill="#64748b" font-size="11" font-family="monospace" letter-spacing="3">FEATURED PROJECTS</text>

  <!-- Constellation dots -->
  <circle cx="152" cy="165" r="2" fill="#a78bfa" opacity="0.4">
    <animate attributeName="opacity" values="0.2;0.6;0.2" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="425" cy="165" r="2" fill="#ffb020" opacity="0.4">
    <animate attributeName="opacity" values="0.2;0.6;0.2" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="697" cy="165" r="2" fill="#00d4ff" opacity="0.4">
    <animate attributeName="opacity" values="0.2;0.6;0.2" dur="4s" repeatCount="indefinite"/>
  </circle>

  <!-- Constellation lines -->
  <line x1="152" y1="165" x2="425" y2="165" stroke="url(#conn-grad)" stroke-width="0.5"/>
  <line x1="425" y1="165" x2="697" y2="165" stroke="url(#conn-grad)" stroke-width="0.5"/>

  <!-- Card 1: farms -->
  <g style="animation: card-appear 0.6s ease-out 0.1s both;">
    <g clip-path="url(#card-clip-0)">
      <rect x="32.5" y="55" width="240" height="155" rx="8" ry="8" fill="url(#card-bg)" stroke="#1a2332" stroke-width="1"/>
      <circle cx="50" cy="75" r="14" fill="none" stroke="#a78bfa" stroke-width="1.5" opacity="0.6"/>
      <text x="50" y="79" text-anchor="middle" fill="#a78bfa" font-size="12" font-family="sans-serif" font-weight="bold" filter="url(#proj-glow-0)">N</text>
      <text x="72" y="79" fill="#f1f5f9" font-size="12" font-family="sans-serif" font-weight="bold">nutsclub</text>
      <text x="72" y="93" fill="#10b981" font-size="8" font-family="monospace">PHP</text>
    </g>
    <!-- Description -->
    <text x="50" y="115" fill="#94a3b8" font-size="9" font-family="sans-serif">
      <tspan x="50" dy="0">Nuts Poker - Mesa de poker</tspan>
      <tspan x="50" dy="14">online. WordPress theme com</tspan>
      <tspan x="50" dy="14">docker, paleta premium e i18n.</tspan>
    </text>
    <!-- Footer stats -->
    <text x="50" y="195" fill="#64748b" font-size="8" font-family="monospace">101 commits</text>
    <circle cx="255" cy="74" r="4" fill="#a78bfa" opacity="0.3">
      <animate attributeName="r" values="3;5;3" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Card 2: gleam-draw -->
  <g style="animation: card-appear 0.6s ease-out 0.3s both;">
    <g clip-path="url(#card-clip-1)">
      <rect x="305.0" y="55" width="240" height="155" rx="8" ry="8" fill="url(#card-bg)" stroke="#1a2332" stroke-width="1"/>
      <circle cx="322.5" cy="75" r="14" fill="none" stroke="#ffb020" stroke-width="1.5" opacity="0.6"/>
      <text x="322.5" y="79" text-anchor="middle" fill="#ffb020" font-size="12" font-family="sans-serif" font-weight="bold" filter="url(#proj-glow-1)">G</text>
      <text x="344.5" y="79" fill="#f1f5f9" font-size="12" font-family="sans-serif" font-weight="bold">gleam-draw</text>
      <text x="344.5" y="93" fill="#3178c6" font-size="8" font-family="monospace">TypeScript · React</text>
    </g>
    <text x="322.5" y="115" fill="#94a3b8" font-size="9" font-family="sans-serif">
      <tspan x="322.5" dy="0">App React/Vite com Tailwind CSS.</tspan>
      <tspan x="322.5" dy="14">Lovable-generated project com</tspan>
      <tspan x="322.5" dy="14">TypeScript, bun, vitest.</tspan>
    </text>
    <text x="322.5" y="195" fill="#64748b" font-size="8" font-family="monospace">8 commits</text>
  </g>

  <!-- Card 3: cleancopy -->
  <g style="animation: card-appear 0.6s ease-out 0.5s both;">
    <g clip-path="url(#card-clip-2)">
      <rect x="577.5" y="55" width="240" height="155" rx="8" ry="8" fill="url(#card-bg)" stroke="#1a2332" stroke-width="1"/>
      <circle cx="595" cy="75" r="14" fill="none" stroke="#00d4ff" stroke-width="1.5" opacity="0.6"/>
      <text x="595" y="79" text-anchor="middle" fill="#00d4ff" font-size="12" font-family="sans-serif" font-weight="bold" filter="url(#proj-glow-2)">C</text>
      <text x="617" y="79" fill="#f1f5f9" font-size="12" font-family="sans-serif" font-weight="bold">cleancopy</text>
      <text x="617" y="93" fill="#f1e05a" font-size="8" font-family="monospace">JavaScript</text>
    </g>
    <text x="595" y="115" fill="#94a3b8" font-size="9" font-family="sans-serif">
      <tspan x="595" dy="0">Chrome extension para limpeza</tspan>
      <tspan x="595" dy="14">de clipboard. i18n, analytics,</tspan>
      <tspan x="595" dy="14">pronto para Chrome Web Store.</tspan>
    </text>
    <text x="595" y="195" fill="#64748b" font-size="8" font-family="monospace">1 commit · Chrome extension</text>
  </g>
</svg>
